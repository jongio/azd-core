version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt         # Check for code formatting
    - goimports     # Check for import formatting
  settings:
    gofmt:
      simplify: true

linters:
  enable:
    - errcheck      # Check for unchecked errors

    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Check for unused code
    - misspell      # Check for misspelled words
    - revive        # Drop-in replacement for golint
    - unparam       # Report unused function parameters
    - unconvert     # Remove unnecessary type conversions
    - goconst       # Find repeated strings that could be constants
    - dupl          # Code clone detection
    - nolintlint    # Ensure nolint directives are properly formatted
    - gosec         # Security checker for Go code
    - bodyclose     # Check for HTTP response body close
    - gocritic      # Comprehensive Go source code linter
    # Dispatch-level linters
    - errname       # Check error type naming conventions
    - exhaustive    # Check exhaustiveness of enum switch statements
    - forcetypeassert # Find forced type assertions
    - makezero      # Find slice declarations not initialized with zero length
    - nilerr        # Find code returning nil error incorrectly
    - noctx         # Find HTTP requests without context
    - prealloc      # Find slice pre-allocation opportunities
    - predeclared   # Find shadowed predeclared identifiers
    - tparallel     # Detect inappropriate t.Parallel() usage
    - wastedassign  # Find wasted assignments
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    staticcheck:
      checks: ["all"]
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - appendAssign
        - elseif
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: '(.+)_test\.go'
        linters:
          - dupl
          - errcheck
          - goconst
          - unparam
          - forcetypeassert
          - noctx
          - exhaustive
          - prealloc
          - gosec
          - revive
          - misspell
      - path: 'magefile\.go'
        linters:
          - unparam
          - errcheck
      # OS constant strings are idiomatic Go, not magic strings
      - text: "string `windows`"
        linters:
          - goconst
      - text: "string `darwin`"
        linters:
          - goconst
      - text: "string `linux`"
        linters:
          - goconst
      # Subprocess with variables is expected in cmd/proc utilities
      - path: '(cmdutil|editor|healthcheck)\/'
        linters:
          - gosec
        text: "G204"
      # File read from variable path is expected in file/cache utilities
      - path: '(fileutil|cache|copilotskills|healthcheck)\/'
        linters:
          - gosec
        text: "G304"
      # exec.Command without context in path/editor utilities (no context available)
      - path: '(pathutil|editor)\/'
        linters:
          - noctx
      # Unused params kept for API stability / future use
      - path: 'healthcheck\/'
        linters:
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
